# Tool settings for linting, type checking, and tests.  The scripts run
# directly (python cogis_scraper.py) and aren't installed as a package, so
# there's no [project] or [build-system] table.  Dependencies are in
# requirements.txt (to run) and requirements-dev.txt (to develop).

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "D", "ANN", "PTH", "RET"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["common", "cogis_scraper", "bradenhead_scraper", "owp2csv", "build_ranked_wells", "build_dashboard", "main", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Test names describe the test, and expected values are literal by design.
"tests/test_*.py" = ["D103", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["common.py", "cogis_scraper.py", "bradenhead_scraper.py", "owp2csv.py", "build_ranked_wells.py", "build_dashboard.py", "main.py", "tests"]
mypy_path = "tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reruns a scraper over the full HTML cache (deselect with -m 'not slow')",
]
